<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>🎮 Игровая Встреча</title>
    <style>
        /* Общий стиль страницы */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('background.JPG') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            overflow: hidden; /* Убираем скролл */
        }

        /* Анимация текста */
        .animated-text {
            animation: blink 2s infinite;
            font-size: 1.1em;
            color: gold;
            text-shadow: 1px 1px 2px black;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Основной контейнер */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            color: gold;
            text-shadow: 2px 2px #000;
            letter-spacing: 2px;
        }

        /* Полноэкранное окно видеоконференции */
        .video-container {
            flex-grow: 1;
            width: 95%;
            max-width: 1200px;
            height: 100%;
            margin: 0 auto;
            border-radius: 12px;
            box-shadow: 0 0 15px #00ffff;
            overflow: hidden;
            backdrop-filter: blur(4px);
            opacity: 0.95;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 12px;
        }

        /* Кнопка скачивания */
        .download-btn {
            margin-top: 10px;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .download-btn:hover {
            background-color: rgba(255, 0, 0, 1);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Заголовок -->
        <h1>⚔️ ИГРОВАЯ КОМНАТА ⚔️</h1>

        <!-- Полноэкранное видео -->
        <div class="video-container">
            <iframe 
                src="https://meet.jit.si/GX- ИгроваяКомната"
                allow="camera; microphone; fullscreen; display-capture"
            ></iframe>
        </div>

        <!-- Анимированный текст + кнопка -->
        <div style="text-align:center;">
            <div class="animated-text">
                🔽 Скачайте RadminVPN и присоединяйтесь к вирт.сети!
            </div>
            <a href="https://www.radmin-vpn.com/download/ " target="_blank">
                <button class="download-btn">Скачать RadminVPN</button>
            </a>
        </div>
    </div>

</body>
</html>
